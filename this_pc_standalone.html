<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨立本機驗證頁面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #1e1e24; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #2b2b36; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 380px; }
        input { padding: 10px; width: 85%; font-size: 16px; margin: 20px 0; border-radius: 6px; border: 1px solid #444; text-align: center; background: #181820; color: white; }
        button { padding: 10px 24px; background: #0078d7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #white-screen-lock { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 999999; }
    </style>
</head>
<body>

    <!-- 答題卡片 -->
    <div class="card" id="quiz-card">
        <h2 style="color: #00d2ff; margin-bottom: 10px;">💻 本機終端驗證</h2>
        <p style="color: #aaa; font-size: 14px;">問題：請輸入管理員核心密碼</p>
        <input type="text" id="ans-input" placeholder="請輸入答案" autocomplete="off">
        <br>
        <button onclick="checkAns()">驗證解鎖</button>
    </div>

    <!-- 成功卡片 (含 QR Code 與倒數) -->
    <div class="card" id="result-card" style="display: none;">
        <h3 style="color: #4caf50; margin-bottom: 10px;">🎉 驗證成功！</h3>
        <p style="font-size: 14px; color: #ddd; margin-bottom: 15px;">請掃描下方 QR Code 進入下一關：</p>
        <img id="qr-img" src="" alt="QR Code" style="width: 160px; height: 160px; background: white; padding: 5px; border-radius: 6px;">
        <p style="color: #ff5252; margin-top: 15px; font-weight: bold; font-size: 13px;">
            ⚠️ 畫面將於 <span id="timer">120</span> 秒後強制全白鎖死！
        </p>
    </div>

    <!-- 全白鎖死畫面 -->
    <div id="white-screen-lock"></div>

    <script>
        const CORRECT_ANS = "admin888"; // 設定答案
        const TARGET_URL = "https://example.com/next-level"; // 設定 QR Code 連結
        const STORAGE_KEY = 'standalone_pc_data';

        function checkAns() {
            let input = document.getElementById('ans-input').value.trim();
            if (input === CORRECT_ANS) {
                document.getElementById('quiz-card').style.display = 'none';
                document.getElementById('result-card').style.display = 'block';
                document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(TARGET_URL)}`;
                
                let t = 120;
                let timer = setInterval(() => {
                    t--;
                    document.getElementById('timer').innerText = t;
                    if (t <= 0) {
                        clearInterval(timer);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify({ isLocked: true }));
                        document.getElementById('white-screen-lock').style.display = 'block';
                    }
                }, 1000);
            } else {
                alert("❌ 密碼錯誤！");
            }
        }

        // 檢測是否已被鎖死
        function checkState() {
            let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (data.isLocked) {
                document.getElementById('white-screen-lock').style.display = 'block';
            }
        }

        // 按 Ctrl + Shift + A 可以解除全白鎖定 (供工作人員備用)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'A') {
                let pin = prompt("管理員密碼：");
                if (pin === "8888") {
                    localStorage.removeItem(STORAGE_KEY);
                    document.getElementById('white-screen-lock').style.display = 'none';
                    alert("已解除全白鎖定！");
                    location.reload();
                }
            }
        });

        window.onload = checkState;
    </script>
</body>
</html>
