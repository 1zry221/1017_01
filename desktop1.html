<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 桌面 - 闖關機 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; user-select: none; }
        body { width: 100vw; height: 100vh; background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920') center/cover no-repeat; overflow: hidden; position: relative; }

        /* 桌面圖示網格 */
        .desktop-grid { display: grid; grid-template-rows: repeat(5, 95px); grid-auto-flow: column; gap: 15px; padding: 20px; width: fit-content; }
        .icon-item { width: 90px; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); cursor: pointer; position: relative; border-radius: 6px; padding: 5px; }
        .icon-item:hover { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); }
        .icon-item img { width: 44px; height: 44px; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .icon-title { font-size: 12px; text-align: center; word-break: break-all; line-height: 1.2; }
        
        /* 圖示角標 (剩餘答對次數) */
        .badge-count { position: absolute; bottom: 22px; left: 8px; background: rgba(0, 0, 0, 0.85); color: #00ffcc; font-weight: bold; font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid #00ffcc; box-shadow: 0 0 5px rgba(0,255,204,0.5); }
        .icon-item.disabled { opacity: 0.35; filter: grayscale(100%); cursor: not-allowed; pointer-events: none; }
        .icon-item.locked { filter: brightness(0.4) grayscale(80%); }

        /* ================= 擬真 Windows 工作列 (Taskbar) ================= */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            color: #ffffff;
            z-index: 9999;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 左側：開始圖示 + 搜尋列 */
        .taskbar-left { display: flex; align-items: center; gap: 8px; }
        .start-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; }
        .start-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .win-icon { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; }
        .win-square { background: #0078d7; width: 100%; height: 100%; }

        .search-box {
            background: #2b2b2b;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            height: 32px;
            width: 220px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
            color: #b0b0b0;
            font-size: 13px;
            cursor: text;
        }
        .search-box:hover { background: #333333; border-color: #555555; }
        .taskbar-divider { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.15); margin: 0 2px; }

        /* 中間：白色圓形按鈕 */
        .taskbar-center { position: absolute; left: 50%; transform: translateX(-50%); }
        .circle-action-btn {
            width: 32px;
            height: 32px;
            background: #ffffff;
            color: #111111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }
        .circle-action-btn:hover { transform: scale(1.08); background: #f0f0f0; }

        /* 右側：系統常駐列 (Tray) */
        .taskbar-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .tray-item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
        .tray-item:hover { background: rgba(255, 255, 255, 0.1); }
        .ime-badge { background: rgba(255, 255, 255, 0.18); padding: 1px 5px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        
        .datetime-box { text-align: right; font-size: 11px; line-height: 1.2; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
        .datetime-box:hover { background: rgba(255, 255, 255, 0.1); }

        /* Modal 視窗與全白鎖屏 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
        .window-box { width: 420px; background: #f0f0f0; border-radius: 8px; border: 1px solid #777; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .window-header { background: #0078d7; color: white; padding: 8px 12px; font-weight: bold; display: flex; justify-content: space-between; font-size: 14px; }
        .window-body { padding: 20px; text-align: center; color: #333; }
        .window-body input { width: 80%; padding: 8px; margin: 15px 0; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .window-body button { padding: 8px 22px; background: #0078d7; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }

        #white-screen-lock { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 999999; }
        .admin-box { width: 480px; background: #2d2d2d; color: white; border-radius: 8px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .admin-btn { padding: 8px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-warning { background: #ff9800; color: white; }
    </style>
</head>
<body>

    <!-- 桌面圖示網格 (1個本機 + 8個題目圖示) -->
    <div class="desktop-grid">
        <div class="icon-item locked" id="icon-this-pc" onclick="clickThisPC()">
            <img src="https://img.icons8.com/color/96/000000/monitor.png" alt="本機">
            <div class="icon-title">本機</div>
        </div>

        <div class="icon-item" id="icon-p1" onclick="openPuzzle('p1', '問題 1：請輸入系統啟動密碼', '1234')">
            <img src="https://img.icons8.com/color/96/000000/folder-invoices.png" alt="圖示">
            <div class="badge-count" id="badge-p1">4</div>
            <div class="icon-title">機密資料夾</div>
        </div>

        <div class="icon-item" id="icon-p2" onclick="openPuzzle('p2', '問題 2：台灣最高的山峰名稱？', '玉山')">
            <img src="https://img.icons8.com/color/96/000000/txt.png" alt="圖示">
            <div class="badge-count" id="badge-p2">4</div>
            <div class="icon-title">提示筆記.txt</div>
        </div>

        <div class="icon-item" id="icon-p3" onclick="openPuzzle('p3', '問題 3：1 + 1 等於幾？', '2')">
            <img src="https://img.icons8.com/color/96/000000/word.png" alt="圖示">
            <div class="badge-count" id="badge-p3">4</div>
            <div class="icon-title">物理實驗報告.docx</div>
        </div>

        <div class="icon-item" id="icon-p4" onclick="openPuzzle('p4', '問題 4：摩斯密碼 ··· --- ··· 代表？', 'SOS')">
            <img src="https://img.icons8.com/color/96/000000/chrome.png" alt="圖示">
            <div class="badge-count" id="badge-p4">4</div>
            <div class="icon-title">Google Chrome</div>
        </div>

        <div class="icon-item" id="icon-p5" onclick="openPuzzle('p5', '問題 5：十六進位 FF 的十進位數值？', '255')">
            <img src="https://img.icons8.com/color/96/000000/code.png" alt="圖示">
            <div class="badge-count" id="badge-p5">4</div>
            <div class="icon-title">CodeBlocks</div>
        </div>

        <div class="icon-item" id="icon-p6" onclick="openPuzzle('p6', '問題 6：請輸入英文單字：APPLE', 'APPLE')">
            <img src="https://img.icons8.com/color/96/000000/calculator.png" alt="圖示">
            <div class="badge-count" id="badge-p6">4</div>
            <div class="icon-title">計算機.exe</div>
        </div>

        <div class="icon-item" id="icon-p7" onclick="openPuzzle('p7', '問題 7：一年有幾個月？', '12')">
            <img src="https://img.icons8.com/color/96/000000/pdf.png" alt="圖示">
            <div class="badge-count" id="badge-p7">4</div>
            <div class="icon-title">機密手冊.pdf</div>
        </div>

        <div class="icon-item" id="icon-p8" onclick="openPuzzle('p8', '問題 8：請輸入終極解密碼：888', '888')">
            <img src="https://img.icons8.com/color/96/000000/vlc.png" alt="圖示">
            <div class="badge-count" id="badge-p8">4</div>
            <div class="icon-title">媒體播放器</div>
        </div>
    </div>

    <!-- ================= 擬真 Taskbar 結構 ================= -->
    <div class="taskbar">
        <!-- 左側選單 -->
        <div class="taskbar-left">
            <div class="start-btn" title="開始">
                <div class="win-icon">
                    <div class="win-square"></div>
                    <div class="win-square"></div>
                    <div class="win-square"></div>
                    <div class="win-square"></div>
                </div>
            </div>
            <div class="search-box">
                <span>🔍</span>
                <span>在此處輸入文字來搜尋</span>
            </div>
            <div class="taskbar-divider"></div>
        </div>

        <!-- 中間圓形按鈕 -->
        <div class="taskbar-center">
            <div class="circle-action-btn" title="點擊展開">↓</div>
        </div>

        <!-- 右側系統常駐列 -->
        <div class="taskbar-right">
            <div class="tray-item">
                <span>🌤️</span>
                <span>24°C 多雲時晴</span>
            </div>
            <div class="tray-item" title="音量">🔊</div>
            <div class="tray-item" title="網路">📶</div>
            <div class="ime-badge">中</div>
            <div class="datetime-box" id="tray-clock" onclick="clickClockCount()" title="連點 3 下開啟管理員後台">
                <div id="clock-time">上午 03:22</div>
                <div id="clock-date" style="color: #aaa;">2026/10/16</div>
            </div>
        </div>
    </div>

    <!-- 解謎 Modal -->
    <div class="modal-overlay" id="puzzle-modal">
        <div class="window-box">
            <div class="window-header">
                <span id="modal-title">題目解密</span>
                <span style="cursor:pointer;" onclick="closeModal('puzzle-modal')">✕</span>
            </div>
            <div class="window-body">
                <p id="modal-q" style="font-weight:bold;">題目載入中...</p>
                <input type="text" id="modal-ans" placeholder="請輸入答案" autocomplete="off">
                <br>
                <button onclick="submitAnswer()">確認送出</button>
            </div>
        </div>
    </div>

    <!-- 本機成功 Modal -->
    <div class="modal-overlay" id="this-pc-modal">
        <div class="window-box">
            <div class="window-header"><span>本機 - 核心檔案解鎖</span></div>
            <div class="window-body">
                <h3 style="color:#28a745; margin-bottom: 10px;">🎉 核心驗證成功！</h3>
                <p style="font-size: 14px; margin-bottom: 15px;">恭喜取得核心線索，請使用手機掃描下方二維碼進入下一關卡：</p>
                <img id="qr-img" src="" style="width: 160px; height: 160px; border: 1px solid #ccc; padding: 5px;">
                <p style="color:red; margin-top:15px; font-weight:bold; font-size: 13px;">
                    ⚠️ 電腦系統將於 <span id="timer-count">120</span> 秒後自我鎖定！
                </p>
            </div>
        </div>
    </div>

    <!-- 全白鎖死畫面 -->
    <div id="white-screen-lock"></div>

    <!-- 管理員後台 Modal -->
    <div class="modal-overlay" id="admin-modal">
        <div class="admin-box">
            <h3>⚙️ 隱藏管理員控制台 (單機版)</h3>
            <div style="margin-bottom: 15px;">
                <p><strong>「本機」狀態控制：</strong></p>
                <button class="admin-btn btn-green" onclick="adminToggleForcePC(true)">強制解鎖本機</button>
                <button class="admin-btn btn-red" onclick="adminToggleForcePC(false)">恢復預設規則 (需答對2次)</button>
            </div>
            <div style="margin-bottom: 15px;">
                <p><strong>系統鎖定控制：</strong></p>
                <button class="admin-btn btn-warning" onclick="adminResetWhiteLock()">解除全白鎖定畫面</button>
            </div>
            <div style="margin-bottom: 15px;">
                <p><strong>重置數據：</strong></p>
                <button class="admin-btn btn-red" onclick="adminResetData()">⚠️ 清空本機所有答題紀錄</button>
            </div>
            <hr style="border-color:#555; margin:15px 0;">
            <button class="admin-btn" style="background:#6c757d; color:white;" onclick="closeModal('admin-modal')">關閉後台</button>
        </div>
    </div>

    <script>
        const PUZZLE_IDS = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'];
        const MAX_CORRECT = 4;
        const STORAGE_KEY = 'desktop1_game_data';
        
        let currentPId = null;
        let currentCorrectAns = null;
        let clockClickCount = 0;

        // 即時更新系統時間與日期
        function updateLiveClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;

            let year = now.getFullYear();
            let month = (now.getMonth() + 1).toString().padStart(2, '0');
            let day = now.getDate().toString().padStart(2, '0');

            document.getElementById('clock-time').innerText = `${ampm} ${hours.toString().padStart(2, '0')}:${minutes}`;
            document.getElementById('clock-date').innerText = `${year}/${month}/${day}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function getLocalData() {
            let data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { counts: {}, forceUnlock: false, isLocked: false };
        }

        function saveLocalData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            updateUI();
        }

        function updateUI() {
            let data = getLocalData();

            if (data.isLocked) {
                document.getElementById('white-screen-lock').style.display = 'block';
                return;
            } else {
                document.getElementById('white-screen-lock').style.display = 'none';
            }

            let allAnsweredTwoTimes = true;
            PUZZLE_IDS.forEach(id => {
                let count = data.counts[id] || 0;
                let remaining = Math.max(0, MAX_CORRECT - count);

                let badge = document.getElementById(`badge-${id}`);
                let icon = document.getElementById(`icon-${id}`);

                if (badge) badge.innerText = remaining;

                if (count >= MAX_CORRECT && icon) {
                    icon.classList.add('disabled');
                } else if (icon) {
                    icon.classList.remove('disabled');
                }

                if (count < 2) allAnsweredTwoTimes = false;
            });

            let pcIcon = document.getElementById('icon-this-pc');
            if (allAnsweredTwoTimes || data.forceUnlock) {
                pcIcon.classList.remove('locked');
            } else {
                pcIcon.classList.add('locked');
            }
        }

        function openPuzzle(id, question, answer) {
            let data = getLocalData();
            if ((data.counts[id] || 0) >= MAX_CORRECT) {
                alert("該圖示已達最大答對/檢閱次數 (4次)，已停用！");
                return;
            }
            currentPId = id;
            currentCorrectAns = answer;
            document.getElementById('modal-q').innerText = question;
            document.getElementById('modal-ans').value = '';
            document.getElementById('puzzle-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function submitAnswer() {
            let input = document.getElementById('modal-ans').value.trim();
            if (input === currentCorrectAns) {
                alert("🎉 答案正確！");
                let data = getLocalData();
                data.counts[currentPId] = (data.counts[currentPId] || 0) + 1;
                saveLocalData(data);
                closeModal('puzzle-modal');
            } else {
                alert("❌ 答案錯誤，請再試一次！");
            }
        }

        function clickThisPC() {
            let pcIcon = document.getElementById('icon-this-pc');
            if (pcIcon.classList.contains('locked')) {
                alert("【系統提示】本機目前無法顯示！\n需要所有其他圖示都被答對過 2 次，或由工作人員從後台開啟。");
                return;
            }

            currentPId = 'this_pc_puzzle';
            currentCorrectAns = 'core999';
            document.getElementById('modal-q').innerText = "【本機核心驗證】請輸入主機核心金鑰：";
            document.getElementById('modal-ans').value = '';
            document.getElementById('puzzle-modal').style.display = 'flex';

            document.querySelector('#puzzle-modal button').onclick = function() {
                if (document.getElementById('modal-ans').value.trim() === currentCorrectAns) {
                    closeModal('puzzle-modal');
                    triggerThisPCSuccess("https://example.com/stage-target");
                } else {
                    alert("❌ 金鑰不正確！");
                }
            };
        }

        function triggerThisPCSuccess(targetUrl) {
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(targetUrl)}`;
            document.getElementById('this-pc-modal').style.display = 'flex';

            let t = 120;
            let timer = setInterval(() => {
                t--;
                document.getElementById('timer-count').innerText = t;
                if (t <= 0) {
                    clearInterval(timer);
                    let data = getLocalData();
                    data.isLocked = true;
                    saveLocalData(data);
                }
            }, 1000);
        }

        function openAdminModal() {
            let pin = prompt("請輸入管理員密碼：");
            if (pin === "8888") {
                document.getElementById('admin-modal').style.display = 'flex';
            } else if (pin !== null) {
                alert("密碼錯誤！");
            }
        }

        function adminToggleForcePC(status) {
            let data = getLocalData();
            data.forceUnlock = status;
            saveLocalData(data);
            alert(status ? "已強制開放本機！" : "已恢復預設規則。");
        }

        function adminResetWhiteLock() {
            let data = getLocalData();
            data.isLocked = false;
            saveLocalData(data);
            alert("已解除全白鎖死畫面！");
        }

        function adminResetData() {
            if (confirm("確定要重置本台電腦的所有答題紀錄與狀態？")) {
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
                alert("本機數據已成功重置！");
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'A') {
                openAdminModal();
            }
        });

        function clickClockCount() {
            clockClickCount++;
            if (clockClickCount >= 3) {
                clockClickCount = 0;
                openAdminModal();
            }
            setTimeout(() => { clockClickCount = 0; }, 2000);
        }

        window.onload = updateUI;
        if (window.location.search.includes('reset=true')) {
            localStorage.removeItem(STORAGE_KEY);
            alert('已成功重置本頁所有紀錄！');
            window.location.href = window.location.pathname;
        }

        window.onload = updateUI;
    </script>
</body>
</html>
    </script>
</body>
</html>
